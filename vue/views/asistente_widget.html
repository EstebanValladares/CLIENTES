<!-- ======================================================== -->
<!-- WIDGET CENTINELA DE ESQUINA: ASISTENTE DE PANTALLA       -->
<!-- Ubicación Modular: vue/views/asistente_widget.html        -->
<!-- ======================================================== -->

<div id="asistente-centinela" class="fixed bottom-5 right-6 z-50 flex flex-col items-end pointer-events-none select-none">

  <!-- ======================================================== -->
  <!-- 1. GLOBO FLOTANTE DE SALUDO AL CARGAR EL DASHBOARD       -->
  <!-- ======================================================== -->
  <transition enter-active-class="transition-all duration-300 ease-out"
              enter-from-class="opacity-0 translate-y-3 scale-95"
              enter-to-class="opacity-100 translate-y-0 scale-100"
              leave-active-class="transition-all duration-200 ease-in"
              leave-from-class="opacity-100 translate-y-0 scale-100"
              leave-to-class="opacity-0 translate-y-2 scale-95">
    
    <div v-if="asistenteGloboVisible && !chatAsistenteAbierto"
         class="pointer-events-auto relative mb-3 w-72 sm:w-80 bg-white/95 dark:bg-slate-900/95 border border-indigo-200 dark:border-slate-800 rounded-2xl p-3.5 shadow-xl backdrop-blur-md text-slate-800 dark:text-slate-100 animate-pop-speech">
      
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1">
          <p class="text-xs font-bold text-indigo-900 dark:text-indigo-300 flex items-center gap-1.5 mb-1">
            <span>👋 ¡Hola, {{ nombreUsuarioActivo }}!</span>
          </p>
          <p class="text-[11px] text-slate-600 dark:text-slate-300 leading-relaxed font-medium">
            Soy {{ asistenteNombrePersonalizado || 'Toastie' }}. Haz clic en mí en cualquier momento si quieres preguntarme sobre colaboradores, obras, lotes o escalatorias.
          </p>
        </div>
        <button @click="asistenteGloboVisible = false" 
                class="w-5 h-5 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer"
                title="Cerrar saludo">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <!-- Triángulo apuntador hacia la tostada -->
      <div class="absolute -bottom-2 right-8 w-4 h-4 bg-white dark:bg-slate-900 border-r border-b border-indigo-200 dark:border-slate-800 transform rotate-45"></div>
    </div>
  </transition>

  <!-- ======================================================== -->
  <!-- 2. VENTANA DE CHAT INTERACTIVO (AL DAR CLIC A LA TOSTADA)-->
  <!-- ======================================================== -->
  <transition enter-active-class="transition-all duration-200 ease-out"
              enter-from-class="opacity-0 translate-y-4 scale-95"
              enter-to-class="opacity-100 translate-y-0 scale-100"
              leave-active-class="transition-all duration-150 ease-in"
              leave-from-class="opacity-100 translate-y-0 scale-100"
              leave-to-class="opacity-0 translate-y-3 scale-95">
    
    <div v-if="chatAsistenteAbierto"
         class="pointer-events-auto relative mb-3 w-80 sm:w-96 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl flex flex-col overflow-hidden text-slate-800 dark:text-slate-100 z-50 h-[480px]">
      
      <!-- Cabecera del Chat -->
      <div class="px-4 py-3 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full bg-white/20 p-1 flex items-center justify-center overflow-hidden">
            <img src="/static/img/toast.png" alt="Avatar" class="w-full h-full object-contain">
          </div>
          <div>
            <h3 class="text-xs font-bold leading-tight">{{ asistenteNombrePersonalizado || 'Toastie' }}</h3>
            <p class="text-[10px] text-indigo-100 flex items-center gap-1 font-medium">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Asistente Activo
            </p>
          </div>
        </div>
        
        <div class="flex items-center gap-2">
          <button @click="limpiarHistorialChat" 
                  class="text-indigo-200 hover:text-white text-xs p-1 rounded transition cursor-pointer" 
                  title="Limpiar conversación">
            <i class="fa-solid fa-trash-can"></i>
          </button>
          <button @click="chatAsistenteAbierto = false" 
                  class="text-indigo-200 hover:text-white text-sm p-1 rounded transition cursor-pointer" 
                  title="Cerrar chat">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Área de Mensajes con Scroll -->
      <div id="chat-asistente-scroll" class="flex-1 p-3.5 overflow-y-auto space-y-3 custom-scrollbar bg-slate-50/60 dark:bg-slate-900/60">
        <div v-for="(msg, idx) in conversacionChat" :key="idx"
             :class="msg.remitente === 'usuario' ? 'flex justify-end' : 'flex justify-start items-start gap-2'">
          
          <!-- Mini avatar si es el bot -->
          <div v-if="msg.remitente !== 'usuario'" class="w-6 h-6 rounded-full bg-indigo-100 dark:bg-slate-800 flex-shrink-0 flex items-center justify-center overflow-hidden mt-0.5">
            <img src="/static/img/toast.png" class="w-5 h-5 object-contain">
          </div>

          <!-- Burbuja de Mensaje -->
          <div :class="msg.remitente === 'usuario' 
                 ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-3.5 py-2 text-xs max-w-[82%] shadow-sm' 
                 : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-2xl rounded-tl-sm px-3.5 py-2 text-xs max-w-[85%] shadow-sm whitespace-pre-line'">
            {{ msg.texto }}
            <span class="block text-[9px] mt-1 text-right"
                  :class="msg.remitente === 'usuario' ? 'text-indigo-200' : 'text-slate-400'">
              {{ msg.hora }}
            </span>
          </div>
        </div>

        <!-- Indicador cuando está pensando -->
        <div v-if="cargandoRespuestaChat" class="flex justify-start items-center gap-2">
          <div class="w-6 h-6 rounded-full bg-indigo-100 dark:bg-slate-800 flex-shrink-0 flex items-center justify-center overflow-hidden">
            <img src="/static/img/toast.png" class="w-5 h-5 object-contain animate-pulse">
          </div>
          <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl rounded-tl-sm px-3 py-2 text-xs text-slate-400 flex items-center gap-1.5 shadow-sm">
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-bounce"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0.15s"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0.3s"></span>
          </div>
        </div>
      </div>



      <!-- Barra de Entrada de Texto -->
      <div class="p-2.5 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
        <input v-model="textoEntradaChat"
               @keydown.enter.prevent="enviarMensajeDesdeInput"
               type="text"
               placeholder="Escribe tu pregunta o duda..."
               class="flex-1 px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 placeholder-slate-400 transition" />
        
        <button @click="enviarMensajeDesdeInput"
                :disabled="!textoEntradaChat.trim() || cargandoRespuestaChat"
                class="w-8 h-8 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white flex items-center justify-center transition cursor-pointer shadow-sm">
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </div>

    </div>
  </transition>

  <!-- ======================================================== -->
  <!-- 3. PERSONAJE EN LA ESQUINA: TOASTIE ESTÁTICO Y LIMPIO    -->
  <!-- ======================================================== -->
  <div class="pointer-events-auto relative group flex items-center justify-center">

    <!-- Avatar de la Tostada (Limpio, estático, sin animaciones de mareo) -->
    <button @click="toggleChatAsistente"
            class="relative w-20 h-20 sm:w-22 sm:h-22 flex items-center justify-center transition-transform transform active:scale-95 cursor-pointer focus:outline-none group"
            :title="'Haz clic para platicar con ' + (asistenteNombrePersonalizado || 'Toastie')">
      
      <img src="/static/img/toast.png" 
           alt="Asistente" 
           class="w-full h-full object-contain filter drop-shadow-md select-none pointer-events-none transition-transform group-hover:scale-105">

      <!-- Indicador de pulso activo verde sutil -->
      <span class="absolute bottom-1 right-2 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-white dark:border-slate-900 shadow"></span>
    </button>

  </div>

</div>
