<!-- ======================================================== -->
<!-- COMPONENTE: DOCK FLOTANTE DE CONSULTAS RÁPIDAS (VISION GLASS) -->
<!-- Archivo: vue/views/consultas_flotantes/launcher.html     -->
<!-- ======================================================== -->
<div v-show="menuConsultasAbierto" 
     @click.stop 
     class="absolute left-1/2 -translate-x-1/2 top-full mt-3 z-50 select-none animate-dock-pop">

  <!-- MARCO EXTERIOR CON EFECTO HALO DE CRISTAL LÍQUIDO -->
  <div class="dock-capsule-outer p-1.5 rounded-[38px] transition-all duration-300 shadow-2xl"
       :class="temaActual === 'claro' ? 'dock-glass-outer-light' : 'dock-glass-outer-dark'">

    <!-- CÁPSULA INTERIOR (PILL DOCK VERTICAL) -->
    <div class="dock-capsule-inner rounded-[32px] py-4 px-2.5 flex flex-col items-center gap-3.5 transition-all duration-300 min-w-[64px]"
         :class="temaActual === 'claro' ? 'dock-glass-inner-light' : 'dock-glass-inner-dark'">

      <!-- BOTÓN: CHAT DE EQUIPO (ICONO TIPO GEMINI / SPARKLE ✦) -->
      <div class="relative group flex items-center justify-center">
        <button @click="toggleChat"
                type="button"
                class="w-11 h-11 rounded-full flex items-center justify-center transition-all duration-200 transform hover:scale-110 active:scale-95 cursor-pointer relative"
                :class="chatTotalNoLeidos > 0 
                  ? 'bg-gradient-to-tr from-rose-500 via-pink-600 to-indigo-600 text-white shadow-lg shadow-rose-500/40 ring-2 ring-rose-400 animate-pulse'
                  : chatAbierto
                    ? 'bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 text-white shadow-lg shadow-indigo-500/30 ring-2 ring-cyan-400'
                    : (temaActual === 'claro' ? 'dock-glass-sparkle-light hover:text-indigo-600' : 'dock-glass-sparkle-dark hover:text-cyan-300')"
                title="Abrir Chat de Equipo">
          
          <!-- 4-Point Star Sparkle SVG idéntico a la referencia (Gemini) -->
          <svg class="w-5 h-5 transition-transform duration-300 group-hover:rotate-45" 
               :class="chatTotalNoLeidos > 0 || chatAbierto ? 'text-white' : ''"
               viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 0Z"/>
          </svg>

          <!-- BADGE DE MENSAJES NO LEÍDOS DENTRO DEL BOTÓN GEMINI -->
          <span v-if="chatTotalNoLeidos > 0"
                class="absolute -top-1 -right-1 min-w-[18px] h-[18px] bg-rose-500 text-white rounded-full text-[9px] font-black flex items-center justify-center shadow-md animate-bounce px-1 ring-2 ring-white dark:ring-slate-900">
            {{ chatTotalNoLeidos }}
          </span>
        </button>

        <!-- TOOLTIP FLOTANTE A LA DERECHA -->
        <div class="absolute left-full ml-3 px-3 py-1.5 rounded-xl whitespace-nowrap shadow-xl border pointer-events-none opacity-0 group-hover:opacity-100 transition-all duration-200 translate-x-1 group-hover:translate-x-0 z-50 text-xs font-bold flex items-center gap-2"
             :class="temaActual === 'claro'
               ? 'bg-white/95 text-slate-800 border-white shadow-slate-300/40'
               : 'bg-slate-900/95 text-white border-slate-700/80 shadow-black/60'">
          <span>Chat de Equipo</span>
          <span v-if="chatTotalNoLeidos > 0"
                class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-rose-500 text-white font-bold shadow-sm">
            {{ chatTotalNoLeidos }} nuevos
          </span>
          <span v-else
                class="text-[10px] font-mono px-1.5 py-0.5 rounded"
                :class="temaActual === 'claro' ? 'bg-indigo-50 text-indigo-600 border border-indigo-200' : 'bg-indigo-500/20 text-cyan-300 border border-indigo-500/30'">
            WhatsApp UI
          </span>
        </div>
      </div>

      <!-- SEPARADOR SUTIL -->
      <div class="w-6 h-[1px] transition-colors"
           :class="temaActual === 'claro' ? 'bg-slate-300/60' : 'bg-white/10'"></div>

      <!-- BOTÓN: MAPEO DE LOTES (CONSULTA FLOTANTE) -->
      <div class="relative group flex items-center justify-center">
        <button @click="abrirConsultaFlotante('MAPEO')"
                type="button"
                class="w-12 h-12 rounded-full flex items-center justify-center transition-all duration-200 transform hover:scale-110 active:scale-95 cursor-pointer relative"
                :class="temaActual === 'claro' ? 'dock-glass-btn-light' : 'dock-glass-btn-dark'"
                title="Abrir Mapeo de Lotes">
          
          <i class="fa-solid fa-map-location-dot text-base transition-colors"
             :class="temaActual === 'claro' ? 'text-slate-700 group-hover:text-indigo-600' : 'text-slate-950'"></i>
        </button>

        <!-- TOOLTIP FLOTANTE A LA DERECHA -->
        <div class="absolute left-full ml-3 px-3 py-1.5 rounded-xl whitespace-nowrap shadow-xl border pointer-events-none opacity-0 group-hover:opacity-100 transition-all duration-200 translate-x-1 group-hover:translate-x-0 z-50 text-xs font-bold flex items-center gap-2"
             :class="temaActual === 'claro'
               ? 'bg-white/95 text-slate-800 border-white shadow-slate-300/40'
               : 'bg-slate-900/95 text-white border-slate-700/80 shadow-black/60'">
          <span>Mapeo de Lotes</span>
          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded"
                :class="temaActual === 'claro' ? 'bg-indigo-50 text-indigo-600 border border-indigo-200' : 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'">
            {{ (metricasMapeo.total_lotes || 116483).toLocaleString() }}
          </span>
        </div>
      </div>

      <!-- BOTÓN: ESCALATORIA DE PRECIOS & OBRAS (SOC) -->
      <div class="relative group flex items-center justify-center">
        <button @click="abrirConsultaFlotante('ESCALATORIAS')"
                type="button"
                class="w-12 h-12 rounded-full flex items-center justify-center transition-all duration-200 transform hover:scale-110 active:scale-95 cursor-pointer relative"
                :class="temaActual === 'claro' ? 'dock-glass-btn-light' : 'dock-glass-btn-dark'"
                title="Abrir Escalatoria de Precios (Por Obra & Insumos)">
          
          <i class="fa-solid fa-arrow-trend-up text-base transition-colors"
             :class="temaActual === 'claro' ? 'text-slate-700 group-hover:text-amber-500' : 'text-slate-950'"></i>
        </button>

        <!-- TOOLTIP FLOTANTE A LA DERECHA -->
        <div class="absolute left-full ml-3 px-3 py-1.5 rounded-xl whitespace-nowrap shadow-xl border pointer-events-none opacity-0 group-hover:opacity-100 transition-all duration-200 translate-x-1 group-hover:translate-x-0 z-50 text-xs font-bold flex items-center gap-2"
             :class="temaActual === 'claro'
               ? 'bg-white/95 text-slate-800 border-white shadow-slate-300/40'
               : 'bg-slate-900/95 text-white border-slate-700/80 shadow-black/60'">
          <span>Escalatoria de Precios</span>
          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded"
                :class="temaActual === 'claro' ? 'bg-amber-50 text-amber-600 border border-amber-200' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'">
            {{ (metricasEscalatorias.total_escalatorias || 86) }} claves
          </span>
        </div>
      </div>

    </div>
  </div>
</div>
