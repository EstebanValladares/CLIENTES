<!-- ======================================================== -->
<!-- COMPONENTE MODULAR: VENTANA FLOTANTE DE CONSULTA         -->
<!-- Archivo: vue/views/consultas_flotantes/modal_flotante.html -->
<!-- ======================================================== -->
<div v-if="consultaFlotanteActiva" 
     @click.self="cerrarConsultaFlotante"
     class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[100] flex items-center justify-center p-2 sm:p-4 md:p-6 animate-fade-in transition-all">

  <!-- Contenedor de la Ventana Flotante (Estilo App / Dashboard) -->
  <div class="border shadow-2xl flex flex-col overflow-hidden transition-all duration-200"
       :class="[
         consultaMaximizada ? 'w-full h-full rounded-none' : 'w-full max-w-[1650px] h-[92vh] rounded-3xl',
         temaActual === 'claro' 
           ? 'bg-white border-slate-200 shadow-2xl shadow-slate-400/20 ring-1 ring-slate-200' 
           : 'bg-slate-900 border-slate-700/80 ring-1 ring-cyan-500/20'
       ]">

    <!-- BARRA SUPERIOR DE LA VENTANA (HEADER) -->
    <div class="px-5 py-3.5 border-b flex items-center justify-between shrink-0 select-none"
         :class="temaActual === 'claro' ? 'bg-slate-50/95 border-slate-200' : 'bg-slate-900/90 border-slate-800'">
      
      <!-- Lado Izquierdo: Identidad de la Consulta Activa -->
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center text-white shadow-md shadow-cyan-500/20 shrink-0">
          <i class="fa-solid fa-map-location-dot text-base"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="text-sm font-bold tracking-tight truncate"
                :class="temaActual === 'claro' ? 'text-slate-900' : 'text-white'">
              Mapeo de Lotes & Consecutivo Maestro
            </h3>
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-cyan-400/10 text-cyan-600 dark:text-cyan-300 border border-cyan-400/30">
              <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
              {{ (metricasMapeo.total_lotes || 116483).toLocaleString() }} lotes
            </span>
            <span class="hidden sm:inline-block text-[10px] font-mono text-slate-500 uppercase px-2 py-0.5 rounded border"
                  :class="temaActual === 'claro' ? 'bg-slate-100 border-slate-200' : 'bg-slate-800/80 border-slate-700/60'">
              VENTANA FLOTANTE
            </span>
          </div>
          <p class="text-[11px] text-slate-400 truncate mt-0.5">
            Consulta rápida sobre base local O(1) de Enkontrol
          </p>
        </div>
      </div>

      <!-- Lado Derecho: Controles de la Ventana (Maximizar y Cerrar) -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- Botón Maximizar / Restaurar -->
        <button @click="toggleMaximizarConsulta" 
                class="w-8 h-8 rounded-lg border transition cursor-pointer flex items-center justify-center"
                :class="temaActual === 'claro' 
                  ? 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-slate-700' 
                  : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-300 hover:text-white'"
                :title="consultaMaximizada ? 'Restaurar tamaño normal' : 'Maximizar ventana'">
          <i class="fa-solid" :class="consultaMaximizada ? 'fa-compress text-xs' : 'fa-expand text-xs'"></i>
        </button>

        <!-- Botón Cerrar (X) -->
        <button @click="cerrarConsultaFlotante" 
                class="w-8 h-8 rounded-lg border transition cursor-pointer flex items-center justify-center"
                :class="temaActual === 'claro'
                  ? 'bg-slate-100 hover:bg-rose-50 border-slate-300 hover:border-rose-300 text-slate-700 hover:text-rose-600'
                  : 'bg-slate-800 hover:bg-rose-600/80 border-slate-700 hover:border-rose-500/50 text-slate-300 hover:text-white'"
                title="Cerrar ventana (Esc)">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- CUERPO DE LA VENTANA (SCROLLABLE INDEPENDIENTE) -->
    <div class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6"
         :class="temaActual === 'claro' ? 'bg-slate-50/70' : 'bg-slate-950/60'">
      
      <!-- CONTENIDO DE MAPEO -->
      <div v-show="consultaFlotanteActiva === 'MAPEO'">
        <!-- INCLUDE: views/mapeo.html -->
      </div>

    </div>

  </div>
</div>
