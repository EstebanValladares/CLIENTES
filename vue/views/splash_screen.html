<!-- ======================================================== -->
<!-- COMPONENTE MODULAR: PANTALLA DE CARGA (SPLASH SCREEN)    -->
<!-- ======================================================== -->
<style>
  #pantalla-carga-global {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #0b1120;
    transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.28s ease;
    user-select: none;
  }
  html.theme-light #pantalla-carga-global {
    background-color: #f8fafc;
  }
  #pantalla-carga-global.oculto {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  .pantalla-carga-circulo-exterior {
    width: 124px;
    height: 124px;
    border-radius: 9999px;
    background-color: #ffffff;
    border: 3px solid rgba(226, 232, 240, 0.9);
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35), 0 0 20px rgba(99, 102, 241, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 20px;
    animation: pulsoSuave 3s infinite ease-in-out;
  }
  html.theme-light .pantalla-carga-circulo-exterior {
    border-color: #e2e8f0;
    box-shadow: 0 15px 35px -5px rgba(99, 102, 241, 0.18), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  .circulo-ojos-interior {
    width: 96px;
    height: 96px;
    border-radius: 9999px;
    background-color: #0a0f1a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
  }

  .ojos-animados {
    width: 78px;
    height: auto;
    object-fit: contain;
    transform-origin: center center;
    animation: parpadeoOjosAvatar 2.4s infinite ease-in-out;
    will-change: transform;
  }

  @keyframes parpadeoOjosAvatar {
    0%, 42%, 46%, 100% {
      transform: scaleY(1);
    }
    44% {
      transform: scaleY(0.08); /* Parpadeo rápido natural */
    }
  }

  @keyframes pulsoSuave {
    0%, 100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.025);
    }
  }

  .pantalla-carga-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .pantalla-carga-info .titulo-cargando {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #94a3b8;
  }
  html.theme-light .pantalla-carga-info .titulo-cargando {
    color: #64748b;
  }

  .barra-progreso-cargando {
    width: 140px;
    height: 3px;
    background-color: rgba(51, 65, 85, 0.4);
    border-radius: 9999px;
    overflow: hidden;
    position: relative;
  }
  html.theme-light .barra-progreso-cargando {
    background-color: #e2e8f0;
  }

  .linea-progreso-shimmer {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 45%;
    background: linear-gradient(90deg, #2563eb, #6366f1, #06b6d4);
    border-radius: 9999px;
    animation: moverProgreso 1.2s infinite ease-in-out;
  }

  @keyframes moverProgreso {
    0% {
      left: -40%;
      width: 30%;
    }
    50% {
      left: 25%;
      width: 55%;
    }
    100% {
      left: 100%;
      width: 30%;
    }
  }
</style>

<div id="pantalla-carga-global">
  <div class="pantalla-carga-circulo-exterior">
    <div class="circulo-ojos-interior">
      <img src="/static/img/ojos_crop.png" alt="Cargando..." class="ojos-animados" />
    </div>
  </div>
  <div class="pantalla-carga-info">
    <span class="titulo-cargando">Grupo Velas • Operaciones</span>
    <div class="barra-progreso-cargando">
      <div class="linea-progreso-shimmer"></div>
    </div>
  </div>
</div>

<script>
  (function() {
    function cerrarSplashFailsafe() {
      var s = document.getElementById('pantalla-carga-global');
      if (s && !s.classList.contains('oculto')) {
        s.classList.add('oculto');
        setTimeout(function() {
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }, 320);
      }
    }
    if (document.readyState === 'complete') {
      setTimeout(cerrarSplashFailsafe, 900);
    } else {
      window.addEventListener('load', function() {
        setTimeout(cerrarSplashFailsafe, 900);
      });
    }
    // Failsafe absoluto e incondicional (2.2 segundos) para que nunca se quede trabado
    setTimeout(cerrarSplashFailsafe, 2200);
  })();
</script>
